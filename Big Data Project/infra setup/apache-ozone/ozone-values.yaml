# ==============================================================================
# 📦 Apache Ozone Helm Values Reference
# ==============================================================================

# ------------------------------------------------------------------------------
# 0. Container Image & Version Pinning (Apache Ozone 1.4.0)
# ------------------------------------------------------------------------------
image:
  repository: "apache/ozone"
  tag: "1.4.0"
  pullPolicy: IfNotPresent

# ------------------------------------------------------------------------------
# 1. Cluster Replication Settings
# ------------------------------------------------------------------------------
# 1 for local KinD/Minikube testing; 3 for HA production environments
replication: 1

# ------------------------------------------------------------------------------
# 2. Component Configurations & Resources
# ------------------------------------------------------------------------------
scm:
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

om:
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

datanode:
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

s3gateway:
  enabled: true
  replicaCount: 1
  port: 9878

recon:
  enabled: true
  replicaCount: 1
  port: 9888
