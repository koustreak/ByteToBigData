# ==============================================================================
# 🚦 Unified Traefik Routing Rules: Layer 7 (HTTP) + Layer 4 (TCP Database)
# ==============================================================================
# Apply:
#   kubectl apply -f traefik-routes.yaml
# Delete:
#   kubectl delete -f traefik-routes.yaml
# ==============================================================================

# ------------------------------------------------------------------------------
# ⚡ 1. Layer 7 Route: Apache Spark Master Web Dashboard
# ------------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: spark-ingress
  namespace: spark
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`spark.local`)
      kind: Rule
      services:
        - name: spark-master
          port: 8080
---
# ------------------------------------------------------------------------------
# 🐙 2. Layer 7 Route: ArgoCD GitOps Web Dashboard
# ------------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-ingress
  namespace: argocd
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`argocd.local`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
---
# ------------------------------------------------------------------------------
# 📦 3. Layer 7 Route: Apache Ozone Recon Web Dashboard
# ------------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ozone-recon-ingress
  namespace: ozone
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`ozone.local`)
      kind: Rule
      services:
        - name: ozone-recon
          port: 9888
---
# ------------------------------------------------------------------------------
# 🐘 4. Layer 4 TCP Route: PostgreSQL Database (DBeaver Direct Connection!)
# ------------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: postgres-tcp-route
  namespace: database
spec:
  entryPoints:
    - postgres # Binds to hostPort 5432
  routes:
    - match: HostSNI(`*`) # For non-TLS TCP passthrough, match all incoming traffic
      services:
        - name: postgres-service
          port: 5432
