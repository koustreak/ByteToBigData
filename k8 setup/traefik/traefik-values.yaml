# ==============================================================================
# 🚦 Traefik v3 Helm Values - Unified Layer 4 (TCP) & Layer 7 (HTTP) Routing
# Chart Repository: https://traefik.github.io/charts
# Chart Name: traefik
# ==============================================================================

# ------------------------------------------------------------------------------
# 0. Container Image & Version Pinning (Traefik v3.2.0)
# ------------------------------------------------------------------------------
image:
  registry: docker.io
  repository: traefik
  tag: "v3.2.0"
  pullPolicy: IfNotPresent

# ------------------------------------------------------------------------------
# 1. EntryPoints (Network Port Definitions)
# ------------------------------------------------------------------------------
ports:
  # 🌐 Layer 7 HTTP EntryPoint (Web Apps, Spark, ArgoCD, Ozone)
  web:
    port: 80
    hostPort: 80
    expose:
      default: true
    protocol: TCP

  # 🔒 Layer 7 HTTPS EntryPoint (SSL / TLS)
  websecure:
    port: 443
    hostPort: 443
    expose:
      default: true
    protocol: TCP

  # 🐘 Layer 4 TCP EntryPoint: PostgreSQL (Zero Port-Forwarding to DBeaver!)
  postgres:
    port: 5432
    hostPort: 5432
    expose:
      default: true
    protocol: TCP

  # 📊 Traefik Real-Time Visual Dashboard
  traefik:
    port: 9000
    hostPort: 9000
    expose:
      default: true
    protocol: TCP

# ------------------------------------------------------------------------------
# 2. Real-Time Web Dashboard Configuration
# ------------------------------------------------------------------------------
ingressClass:
  enabled: true
  isDefaultClass: true

ingressRoute:
  dashboard:
    enabled: true # Enables internal dashboard route

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true # Allows Traefik to route across namespaces (database, spark, argocd)
  kubernetesIngress:
    enabled: true

# ------------------------------------------------------------------------------
# 3. Node Scheduling for KinD (Binds to Node with ingress-ready=true)
# ------------------------------------------------------------------------------
nodeSelector:
  ingress-ready: "true"

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Equal"
    effect: "NoSchedule"

# ------------------------------------------------------------------------------
# 4. Resource Allocation
# ------------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
