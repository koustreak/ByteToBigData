# kind-config.yaml
# Single-node Kubernetes cluster configuration optimized for Traefik Ingress (L4 + L7)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dev-cluster
nodes:
  # Single Node (acts as both Control-Plane and Worker for running workloads)
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # 🌐 Layer 7 HTTP EntryPoint (Web Apps, Spark, ArgoCD, Ozone)
      - containerPort: 80
        hostPort: 80
        protocol: TCP

      # 🔒 Layer 7 HTTPS EntryPoint (SSL / TLS)
      - containerPort: 443
        hostPort: 443
        protocol: TCP

      # 🐘 Layer 4 TCP EntryPoint (PostgreSQL directly to DBeaver without port-forward!)
      - containerPort: 5432
        hostPort: 5432
        protocol: TCP

      # 📊 Traefik Real-Time Web Dashboard
      - containerPort: 9000
        hostPort: 9000
        protocol: TCP
